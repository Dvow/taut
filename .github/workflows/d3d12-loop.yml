# Temporary, branch ci only: the Direct3D 12 removal tests, looped under load on a runner (WARP).
name: D3D12 removal loop

on:
  push:
    branches: [ci]

jobs:
  loop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      TAUT_CI: 1
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc -V
      - name: Build
        run: cargo test --lib --all-features --no-run
      - name: 50 rounds of three window tests and the removal test at once
        shell: bash
        run: |
          exe=$(ls target/debug/deps/taut-*.exe | head -1)
          fails=0
          for i in $(seq 1 50); do
            for k in 1 2 3; do "$exe" direct3d_12_and_the_cpu_show_the_same_pixels > out-$k.txt 2>&1 & done
            "$exe" a_removed_software_device > out-4.txt 2>&1 &
            wait
            for k in 1 2 3 4; do grep -q "test result: ok. 1 passed" out-$k.txt || { fails=$((fails+1)); echo "round $i, $k:"; cat out-$k.txt; }; done
          done
          echo "$fails of 200 failed"
          test $fails = 0
