# The Wayland GPU path (zwp_linux_dmabuf_v1 from Vulkan), proven on a machine with /dev/udmabuf:
# Mesa's lavapipe exports real dmabufs through it. Runs only on the branch waylandgpu.
name: waylandgpu

on:
  push:
    branches: [waylandgpu]

concurrency:
  group: waylandgpu
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages, and /dev/udmabuf
        run: |
          uname -r
          grep -E 'UDMABUF|DMABUF_HEAPS|CONFIG_DRM_VGEM|CONFIG_DRM_VKMS|CONFIG_SYNC_FILE' /boot/config-$(uname -r) || true
          find /lib/modules/$(uname -r) -name 'udmabuf*' -o -name 'vgem*' -o -name 'vkms*' | head
          sudo apt-get update
          apt-cache search --names-only "linux-modules.*$(uname -r)" || true
          sudo apt-get install -y linux-modules-extra-$(uname -r) || echo 'no modules-extra package'
          sudo apt-get install -y --no-install-recommends weston xvfb xauth \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1-mesa-dri libegl1 libgles2 libx11-dev
          sudo modprobe udmabuf || echo 'no udmabuf module'
          sudo chmod 666 /dev/udmabuf || true
      - name: Probe
        run: bash .github/waylandgpu/probe.sh
