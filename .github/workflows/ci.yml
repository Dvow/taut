# Every push and pull request: the checks the owner runs, on Windows, Ubuntu and macOS, plus the
# oldest Rust taut supports, the docs as docs.rs builds them, and the package.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: a third of the build time and most of the cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  # Skips what a runner cannot run: only OpenGL on Windows (tests/renderers.rs).
  TAUT_CI: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable && rustc -V
      - uses: actions/cache@v6
        with:
          path: target
          key: windows-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy, all features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy, no features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, gpu without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features gpu -- -D warnings
      - name: Clippy, hdr without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features hdr -- -D warnings
      - name: The DLL tests/dll.rs loads
        if: ${{ !cancelled() }}
        run: cargo build --example overlay
      - name: Tests, all features
        if: ${{ !cancelled() }}
        run: cargo test --all-features --no-fail-fast -- --test-threads=4
      - name: Library tests, no features
        if: ${{ !cancelled() }}
        run: cargo test --lib --no-fail-fast

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Tests built a little optimized: the Brotli check against the system's takes 5 min a run unoptimized.
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
      # The runner has no GPU and Xvfb no DRI3: Mesa's OpenGL is llvmpipe either way. Asked for
      # it at once, EGL doesn't first try for a hardware device and warn that there is none.
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v7
      - name: The runner's image
        id: image
        run: echo "name=${ImageOS:-ubuntu}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
      # The packages downloaded by earlier runs (see `ci apt` in .github/ci.rs).
      - uses: actions/cache@v6
        with:
          path: ~/debs
          key: debs-ubuntu-${{ steps.image.outputs.name }}-${{ hashFiles('.github/workflows/ci.yml', '.github/ci.rs') }}
          restore-keys: debs-ubuntu-
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable && rustc -V
      - name: What the tests and walks load
        run: |
          rustc -O --edition 2024 .github/ci.rs -o ~/ci
          ~/ci apt xvfb xauth dbus dbus-x11 at-spi2-core libglib2.0-bin \
            libx11-6 libxtst6 libxi6 libxrandr2 libxkbcommon0 libfontconfig1 libfreetype6 libharfbuzz0b fonts-dejavu-core \
            libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 xclip
      - uses: actions/cache@v6
        with:
          path: target
          key: ubuntu-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy, no features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, gpu without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features gpu -- -D warnings
      - name: Clippy, hdr without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features hdr -- -D warnings
      - name: Tests, all features
        if: ${{ !cancelled() }}
        run: cargo test --all-features --no-fail-fast -- --test-threads=4
      - name: Library tests, no features
        if: ${{ !cancelled() }}
        run: cargo test --lib --no-fail-fast
      - name: Library tests with windows, on a display of their own
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) GSETTINGS_BACKEND=memory
          xvfb-run -n 190 -s "-screen 0 900x600x24" cargo test --lib --all-features --no-fail-fast -- --include-ignored --skip how_long --skip made_afresh
      - name: Build the walks
        if: ${{ !cancelled() }}
        run: cargo build --release --all-features --example gallery --example walk --example walk_reader
      - name: Walk as a screen reader
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) GSETTINGS_BACKEND=memory
          # To a file: the accessibility bus it starts outlives it and would hold a pipe open.
          status=0
          xvfb-run -n 191 -s "-screen 0 900x600x24" dbus-run-session -- target/release/examples/walk_reader > reader.txt 2>&1 || status=$?
          pkill -f "$XDG_RUNTIME_DIR/at-spi" || true
          # Not shown: the buses' own words, and dbus-run-session's when the walk kills its bus (9).
          grep -v -e "^dbus-daemon" -e "^dbus-run-session: dbus-daemon terminated by signal 9$" reader.txt
          exit $status
      - name: Walk as a person
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) GSETTINGS_BACKEND=memory
          xvfb-run -n 192 -s "-screen 0 900x600x24" target/release/examples/walk "$RUNNER_TEMP/shots"

  # Windows under Wayland shown through dmabufs: the runner has /dev/udmabuf, lavapipe exports
  # into it, and Weston (GL) takes them; pixman Weston proves the fallback to shared memory.
  wayland-dmabufs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The tests fail where no device exports dmabufs, rather than fall back.
      TAUT_DMABUF_EXPORTS: 1
    steps:
      - uses: actions/checkout@v7
      - name: The runner's image
        id: image
        run: echo "name=${ImageOS:-ubuntu}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"
      # The packages downloaded by earlier runs (see `ci apt` in .github/ci.rs).
      - uses: actions/cache@v6
        with:
          path: ~/debs
          key: debs-wayland-${{ steps.image.outputs.name }}-${{ hashFiles('.github/workflows/ci.yml', '.github/ci.rs') }}
          restore-keys: debs-wayland-
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable && rustc -V
      - name: Weston, lavapipe, Xvfb; and /dev/udmabuf
        run: |
          rustc -O --edition 2024 .github/ci.rs -o ~/ci
          ~/ci apt weston xvfb xauth dbus \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libgl1-mesa-dri libegl1 libgles2 \
            libx11-6 libx11-dev libxtst6 libxi6 libxkbcommon0 libfontconfig1 libfreetype6 fonts-dejavu-core
          uname -r
          ls -l /dev/udmabuf
          sudo chmod 666 /dev/udmabuf
          weston --version
          vulkaninfo --summary 2>&1 | grep -E "deviceName|driverInfo"
      - name: Build the tests
        run: cargo test --lib --all-features --no-run
      - name: Tests with a played compositor
        run: cargo test --lib --all-features gpu_wayland -- --nocapture
      - name: GL Weston on Xvfb (dmabufs, the screen read)
        if: ${{ !cancelled() }}
        run: ~/ci desk weston-x11-gl 31 cargo test --lib --all-features gpu_wayland -- --include-ignored --skip how_long --nocapture --test-threads=1
      - name: GL Weston headless (dmabufs)
        if: ${{ !cancelled() }}
        run: ~/ci desk weston-gl 0 cargo test --lib --all-features gpu_wayland -- --include-ignored --skip how_long --nocapture --test-threads=1
      - name: Pixman Weston (no dmabufs; shared memory)
        if: ${{ !cancelled() }}
        run: ~/ci desk weston 0 cargo test --lib --all-features gpu_wayland -- --include-ignored --skip how_long --nocapture --test-threads=1
      - name: Pixman Weston on Xvfb (shared memory, the screen read)
        if: ${{ !cancelled() }}
        run: ~/ci desk weston-x11 32 cargo test --lib --all-features gpu_wayland -- --include-ignored --skip how_long --nocapture --test-threads=1

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable && rustc -V && sw_vers
      - uses: actions/cache@v6
        with:
          path: target
          key: macos-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy, no features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, gpu without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features gpu -- -D warnings
      - name: Clippy, hdr without gpu-draw
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features hdr -- -D warnings
      - name: Window checks (real windows on the runner's screen, which is nobody's)
        if: ${{ !cancelled() }}
        run: TAUT_SHOTS="$RUNNER_TEMP/shots" cargo test --test macos
      - name: Window checks, all features
        if: ${{ !cancelled() }}
        run: TAUT_SHOTS="$RUNNER_TEMP/shots/all-features" cargo test --all-features --test macos
      - name: Library tests, all features
        if: ${{ !cancelled() }}
        run: cargo test --lib --all-features --no-fail-fast
      - name: Library tests, no features
        if: ${{ !cancelled() }}
        run: cargo test --lib --no-fail-fast
      - name: Pictures of the windows
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-pictures
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  # taut in a browser: clippy for wasm32-unknown-unknown, Rust 1.88 for it, the pages under Node
  # and headless Chrome (tests/web.rs), the system's parts driven through the DevTools protocol
  # (tests/web_system.rs), and the programs' sizes.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust, with the web's target
        run: rustup toolchain install stable --profile minimal -c clippy -t wasm32-unknown-unknown && rustup default stable && rustc -V
      - uses: actions/cache@v6
        with:
          path: target
          key: web-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Clippy for the web
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --lib --all-features --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --example hello --example gallery --example web_notes -- -D warnings
      - name: Rust 1.88 for the web
        if: ${{ !cancelled() }}
        run: rustup toolchain install 1.88.0 --profile minimal -t wasm32-unknown-unknown && cargo +1.88.0 check --lib --all-features --target wasm32-unknown-unknown
      - name: The font both sides of the pixel checks draw with, and colour emoji for the browser
        if: ${{ !cancelled() }}
        run: rustc -O --edition 2024 .github/ci.rs -o ~/ci && ~/ci apt fonts-dejavu-core fonts-noto-color-emoji
      - name: Pages under Node and headless Chrome
        if: ${{ !cancelled() }}
        run: node --version && google-chrome --version && cargo test --test web -- --nocapture
      - name: The system's parts in headless Chrome
        if: ${{ !cancelled() }}
        env:
          TAUT_WEB: required
        run: cargo test --test web_system
      - name: Sizes (the release profile of docs/costs-and-speed.md)
        if: ${{ !cancelled() }}
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: true
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_STRIP: true
        run: cargo build --release --target wasm32-unknown-unknown --example hello --example gallery && ls -l target/wasm32-unknown-unknown/release/examples/*.wasm

  # iOS: clippy for devices and the simulator, the oldest Rust, and the checks in the simulator
  # (tests/ios.rs: the gallery against the Mac's drawing and its own, parts driven, readers, dark
  # mode, the background).
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy -t aarch64-apple-ios -t aarch64-apple-ios-sim && rustup default stable && rustc -V && xcodebuild -version
      - uses: actions/cache@v6
        with:
          path: target
          key: ios-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Clippy for devices, all features
        run: cargo clippy --all-targets --all-features --target aarch64-apple-ios -- -D warnings
      - name: Clippy for devices, no features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy for the simulator, touch
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --features touch --target aarch64-apple-ios-sim -- -D warnings
      - name: Rust 1.88 for devices
        if: ${{ !cancelled() }}
        run: rustup toolchain install 1.88.0 --profile minimal -t aarch64-apple-ios && cargo +1.88.0 check --all-targets --all-features --target aarch64-apple-ios
      - name: In the simulator
        if: ${{ !cancelled() }}
        run: TAUT_IOS_SIMULATOR=1 TAUT_SHOTS="$RUNNER_TEMP/ios" cargo test --test ios
      - name: Pictures of the simulator
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-pictures
          path: ${{ runner.temp }}/ios
          if-no-files-found: warn

  macos-gpu:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc -V
      - uses: actions/cache@v6
        with:
          path: target
          key: macos-gpu-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Metal without gpu-draw
        run: cargo test --lib --features gpu -- gpu_metal layer_metal
      - name: Layers under a program's own renderer (Metal, OpenGL through CGL)
        if: ${{ !cancelled() }}
        run: cargo test --all-features --test renderers -- --test-threads=1
      - name: Window checks, Metal showing
        if: ${{ !cancelled() }}
        run: TAUT_SHOTS="$RUNNER_TEMP/shots/metal" cargo test --features gpu --test macos
      - name: Window checks, Metal drawing every part
        if: ${{ !cancelled() }}
        run: TAUT_DRAW=gpu TAUT_SHOTS="$RUNNER_TEMP/shots/metal-draw" cargo test --all-features --test macos
      - name: Pictures of the windows
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-gpu-pictures
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Rust 1.88 (rust-version in Cargo.toml)
        run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0 && rustc -V
      - name: Check, all features
        run: cargo check --all-targets --all-features
      - name: Check, no features
        if: ${{ !cancelled() }}
        run: cargo check --all-targets

  # Android: built for the emulator and phones, packed as APKs (examples/apk.rs), and the
  # gallery run on an Android 15 emulator (src/android_text.rs): its first page against the
  # Linux frame, taps, keys, typing, rotation, home and back, and what uiautomator reads; what
  # screen readers read, through the provider and uiautomator (tests/android.rs); and the system
  # parts (src/android_emulator.rs): file dialog, clipboard, notifications, spelling, composing,
  # named fonts, printing, opening files, drags between two apps; and the GPU
  # (tests/android_gpu.rs): Vulkan and OpenGL ES against the CPU's pixels.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable && rustup target add x86_64-linux-android aarch64-linux-android && rustc -V
      - uses: actions/cache@v6
        with:
          path: target
          key: android-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: Clippy for Android, all features
        run: cargo clippy --all-targets --all-features --target x86_64-linux-android -- -D warnings
      - name: Clippy for Android, no features
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --target x86_64-linux-android -- -D warnings
      - name: Rust 1.88 for Android
        if: ${{ !cancelled() }}
        run: rustup toolchain install 1.88.0 --profile minimal -t x86_64-linux-android && cargo +1.88.0 check --all-targets --target x86_64-linux-android
      - name: The Android parts' tests here (the SDK's dexdump reads the DEX file)
        if: ${{ !cancelled() }}
        run: cargo test --lib android_
      - name: The gallery and hello as APKs, for the emulator and for phones
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo run --example apk -- gallery --target x86_64-linux-android --features touch
          cargo run --example apk -- hello --target aarch64-linux-android
          cargo run --example apk -- gallery --target aarch64-linux-android --features touch --out target/apk/gallery-arm64.apk
          cargo run --example apk -- tests/android.rs --target x86_64-linux-android
          cargo run --example apk -- system_parts --target x86_64-linux-android
          cargo run --example apk -- system_parts --target x86_64-linux-android --package taut.example.parts2 --out target/apk/parts2.apk
          cargo run --example apk -- gallery --target x86_64-linux-android --features gpu-draw,touch --out target/apk/gallery-gpu.apk
          ls -l target/*-linux-android/release/lib*.so target/apk/*.apk
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: An emulator, Android 15
        timeout-minutes: 20
        run: |
          TOOLS=$ANDROID_HOME/cmdline-tools/latest/bin
          ADB=$ANDROID_HOME/platform-tools/adb
          # (avdmanager and the emulator look in different places unless told.)
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          yes | $TOOLS/sdkmanager --licenses > /dev/null || true
          $TOOLS/sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | $TOOLS/avdmanager create avd -n taut -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          nohup $ANDROID_HOME/emulator/emulator -avd taut -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          timeout 300 $ADB wait-for-device
          for i in $(seq 1 150); do [ "$($ADB shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 2; done
          $ADB shell wm dismiss-keyguard || true
          $ADB shell settings put global hide_error_dialogs 1 || true
          sleep 10
      - name: The gallery on the emulator
        run: TAUT_ANDROID_APK=$PWD/target/apk/gallery.apk TAUT_PICTURES=$PWD/android cargo test --lib the_gallery_on_an_android_emulator -- --nocapture
      - name: Screen readers on the emulator
        if: ${{ !cancelled() }}
        run: TAUT_ANDROID_APK=$PWD/target/apk/android.apk TAUT_PICTURES=$PWD/android/readers cargo test --test android -- --nocapture
      - name: Video on the emulator (the library's video tests, run there)
        if: ${{ !cancelled() }}
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME TAUT_VIDEO=required cargo test --features video --test video_android -- --nocapture
      - name: The system parts on the emulator
        if: ${{ !cancelled() }}
        run: TAUT_ANDROID_PARTS_APK=$PWD/target/apk/system_parts.apk TAUT_ANDROID_OTHER_APK=$PWD/target/apk/parts2.apk TAUT_PICTURES=$PWD/android-parts cargo test --lib the_system_parts_on_an_android_emulator -- --nocapture
      - name: The GPU on the emulator (Vulkan and OpenGL ES; the library's checks there, the gallery shown each way)
        if: ${{ !cancelled() }}
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME TAUT_ANDROID_GPU=required TAUT_ANDROID_GPU_APK=$PWD/target/apk/gallery-gpu.apk TAUT_PICTURES=$PWD/android/gpu cargo test --test android_gpu
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: android
          path: |
            android/*.png
            android/gpu/*.png
            android/*.xml
            android/logcat.txt
            android/readers
            android-parts/*.png
            android-parts/*.xml
            android-parts/logcat.txt
            emulator.log

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - name: Nightly, as docs.rs
        run: rustup toolchain install nightly --profile minimal -t x86_64-pc-windows-msvc -t aarch64-apple-darwin -t aarch64-apple-ios -t aarch64-linux-android && rustc +nightly -V
      - name: Docs for Linux
        run: cargo +nightly doc --all-features --no-deps --target x86_64-unknown-linux-gnu
      - name: Docs for Windows
        if: ${{ !cancelled() }}
        run: cargo +nightly doc --all-features --no-deps --target x86_64-pc-windows-msvc
      - name: Docs for macOS
        if: ${{ !cancelled() }}
        run: cargo +nightly doc --all-features --no-deps --target aarch64-apple-darwin
      - name: Docs for the web
        if: ${{ !cancelled() }}
        run: rustup target add --toolchain nightly wasm32-unknown-unknown && cargo +nightly doc --all-features --no-deps --target wasm32-unknown-unknown
      - name: Docs for iOS
        if: ${{ !cancelled() }}
        run: cargo +nightly doc --all-features --no-deps --target aarch64-apple-ios
      - name: Docs for Android
        if: ${{ !cancelled() }}
        run: cargo +nightly doc --all-features --no-deps --target aarch64-linux-android

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Package (the file list builds on its own)
        run: cargo package

  # Video through each system's own player (feature `video`), a missing player failing
  # (TAUT_VIDEO=required): GStreamer's base and good plugins on Ubuntu; on the Mac also the checks
  # on the main thread, where AVFoundation's run loop turns, and the same in the iOS simulator
  # (tests/video_apple.rs); on Ubuntu the web's player in headless Chrome and under Node
  # (tests/video_web.rs). Android's run on the emulator of the `android` job.
  video:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAUT_VIDEO: required
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown -t aarch64-apple-ios-sim && rustup default stable && rustc -V
      - name: GStreamer
        if: runner.os == 'Linux'
        run: rustc -O --edition 2024 .github/ci.rs -o ~/ci && ~/ci apt gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Video tests
        run: cargo test --features video --lib video::tests
      - name: Video on the main thread, and in the iOS simulator
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: TAUT_IOS_SIMULATOR=1 cargo test --features video --test video_apple
      - name: Video in a browser and under Node
        if: ${{ runner.os == 'Linux' && !cancelled() }}
        run: cargo test --features video --test video_web
