# Temporary probe (macos2): only the macOS facts needed, put back to the full CI after.
name: CI

on:
  push:

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  TAUT_CI: 1

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc -V && sw_vers
      - uses: actions/cache@v6
        with:
          path: target
          key: macos-${{ hashFiles('Cargo.toml', 'src/**', 'tests/**', 'examples/**') }}
      - name: HarfBuzz
        run: brew install harfbuzz && ls /opt/homebrew/lib/libharfbuzz* && hb-shape --version
      - name: Probe
        if: ${{ !cancelled() }}
        run: bash .github/probe.sh
