<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="10" y1="60" x2="40" y2="70" spreadMethod="reflect">
      <stop offset="0" style="stop-color:#065f46"/>
      <stop offset="1" style="stop-color:#34d399;stop-opacity:.8"/>
    </linearGradient>
    <linearGradient id="band2" xlink:href="#band" gradientTransform="rotate(20 60 60)" spreadMethod="repeat"/>
    <path id="peak" d="M0 30 L18 0 L36 30 Z"/>
  </defs>
  <rect width="120" height="80" rx="10" fill="url(#sky)"/>
  <circle cx="88" cy="24" r="14" fill="url(#sun)"/>
  <g opacity="0.6">
    <use xlink:href="#peak" x="14" y="34" fill="#1e293b"/>
    <use href="#peak" x="38" y="30" fill="#334155" transform="translate(4 0) scale(1.15 1)"/>
  </g>
  <path d="M0 62 C 20 52, 40 72, 60 62 S 100 52, 120 62 V80 H0 Z" fill="url(#band)"/>
  <path d="M0 70 C 20 60, 40 80, 60 70 S 100 60, 120 70 V80 H0 Z" fill="url(#band2)" stroke="#022c22" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="30" cy="18" rx="12" ry="5" fill="white" fill-opacity="0.75"/>
  <g transform="translate(70 50) rotate(-15) skewX(10)">
    <rect x="-8" y="-5" width="16" height="10" fill="#fef3c7" stroke="#92400e" stroke-width="2" stroke-linejoin="miter" opacity="0.7"/>
  </g>
</svg>
