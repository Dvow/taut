<?xml version="1.0" encoding="UTF-8"?>
<!-- Markers: arrows at the ends, dots at the corners, as large as the line or in units. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3" markerUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.5" fill="#2563eb"/></marker>
    <marker id="bar" markerWidth="2" markerHeight="6" refX="1" refY="3" orient="auto"><rect width="2" height="6" fill="#16a34a"/></marker>
  </defs>
  <path d="M10 70L30 20L60 50L90 15L110 60" fill="none" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-mid="url(#dot)" marker-end="url(#arrow)"/>
  <polyline points="10 10 40 10 40 40" fill="none" stroke="#999" stroke-width="1.5" marker-start="url(#bar)" marker-mid="url(#bar)" marker-end="url(#bar)"/>
  <path d="M70 70C80 50 100 50 110 75" fill="none" stroke="#333" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
