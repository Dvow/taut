<?xml version="1.0" encoding="UTF-8"?>
<!-- Clip paths and masks, as drawing programs write them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <clipPath id="round"><circle cx="20" cy="20" r="16"/></clipPath>
    <clipPath id="half" clipPathUnits="objectBoundingBox"><ellipse cx=".5" cy=".5" rx=".5" ry=".3"/></clipPath>
    <clipPath id="holed"><path clip-rule="evenodd" d="M44 4h32v32h-32z M52 12h16v16h-16z"/></clipPath>
    <clipPath id="box"><rect x="84.3" y="4.6" width="31.4" height="31"/></clipPath>
    <clipPath id="turned" transform="rotate(20 100 60)"><rect x="88" y="48" width="24" height="24"/></clipPath>
    <linearGradient id="fade"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="faded" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fade)"/></mask>
    <mask id="hole"><rect x="44" y="44" width="32" height="32" fill="white"/><circle cx="60" cy="60" r="8" fill="black"/><circle cx="60" cy="60" r="4" fill="#808080"/></mask>
  </defs>
  <g clip-path="url(#round)"><rect width="40" height="20" fill="#e11d48"/><rect y="20" width="40" height="20" fill="#2563eb"/></g>
  <rect x="44" y="4" width="32" height="32" fill="#16a34a" clip-path="url(#holed)"/>
  <rect x="84.3" y="4.6" width="31.4" height="31" fill="#9333ea" clip-path="url(#box)"/>
  <rect x="4" y="44" width="32" height="32" fill="#f59e0b" clip-path="url(#half)"/>
  <rect x="44" y="44" width="32" height="32" fill="#0ea5e9" mask="url(#hole)"/>
  <g mask="url(#faded)"><rect x="88" y="48" width="24" height="24" fill="#db2777" clip-path="url(#turned)"/></g>
</svg>
