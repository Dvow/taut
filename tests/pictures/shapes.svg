  <path d="M0 40 L30 40 L30 70 L0 70 Z M8 48 L22 48 L22 62 L8 62 Z M12 52 h6 v6 h-6 z" fill="#334155" fill-rule="evenodd"/>
  <path d="M36 40 L66 40 L66 70 L36 70 Z M44 48 L44 62 L58 62 L58 48 Z M48 52 h6 v6 h-6 z" fill="#334155"/>
  <use xlink:href="#leaf" x="70" y="42" fill="#15803d"/>
  <use href="#leaf" transform="translate(72 60) rotate(20) scale(1.3 0.8)" fill="none" stroke="#15803d"/>
  <g transform="matrix(0.8 0.3 -0.2 0.9 100 40)" fill="#be123c" stroke="#111" stroke-width="0.8">
    <use xlink:href="#pair"/>
    <use xlink:href="#pair" y="12" opacity="0.5"/>
    <g transform="translate(0 24)" style="fill:#1d4ed8;stroke:none"><use xlink:href="#pair"/></g>
  </g>
