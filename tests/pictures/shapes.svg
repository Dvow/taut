    <g id="pair"><rect width="8" height="8"/><circle cx="14" cy="4" r="4"/></g>
    <rect id="unseen" x="-10" y="-10" width="200" height="200" fill="red"/>
  </defs>
  <rect x="-10" y="-10" width="100%" height="100%" fill="#f1f5f9"/>
  <rect x="5%" y="5%" width="20" height="12" rx="3" fill="#0ea5e9"/>
  <ellipse cx="50" cy="12" rx="14" ry="7" fill="#f97316" stroke="#7c2d12" stroke-width="2pt"/>
  <line x1="70" y1="2" x2="92" y2="20" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
