[package]
name = "taut"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust GUI library for Windows, Linux, macOS, iOS and the web that aims to be small, fast and accessible, with zero dependencies and nothing compiled in that your program doesn't use."
license = "(MIT OR Apache-2.0) AND Unicode-3.0 AND BSD-2-Clause AND BSD-3-Clause"
repository = "https://github.com/Dvow/taut"
homepage = "https://dvow.github.io/taut/"
documentation = "https://docs.rs/taut"
readme = "README.md"
keywords = ["gui", "ui", "immediate-mode", "widgets", "no-dependencies"]
categories = ["gui", "accessibility", "rendering"]
# The library, its examples, its tests (they read `tests/pictures` and `docs/`), and its documents.
include = ["/src", "/examples", "/tests", "/docs", "/README.md", "/GUIDE.md", "/GOALS.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/THIRD-PARTY.md", "/rustfmt.toml"]

# A program compiles in only what it calls. Features cover what calls can't reveal (what users
# type, how they touch, what fonts and pictures they open). All off by default.
[features]
default = []
# Hebrew, Arabic and other right-to-left scripts in Unicode order, Arabic and Syriac joined.
# Without it, their letters show left to right, unjoined.
right-to-left = []
# Indic, South-East Asian and other scripts HarfBuzz shapes with its Indic or Universal Shaping
# Engine, shaped by syllable; Thai, Lao, Khmer and Burmese lines broken between words where the
# system says (Windows, Apple's systems), else between syllables. Without it, the system's text
# draws them (whole on Windows, letter by letter on Linux).
brahmic = []
# With `brahmic`, Thai, Lao, Khmer and Burmese lines broken between words on Linux, Android and
# the web too, from ICU's word lists (804 KB; nothing on Windows and Apple's systems, which have
# their own). A program built with it must carry the Lao and Burmese lists' BSD notices
# (THIRD-PARTY.md). Without it, those lines break between syllables there.
word-lists = ["brahmic"]
# App fonts shaped as pages are: ligatures, contextual forms, marks placed on letters, kerning
# beyond pairs; and the system's text in the language's forms. Without it, app fonts draw glyph
# by glyph, kerned by pairs, and the system's text in its default forms.
shaping = []
# Readings (ruby) over rich text and beside vertical text (`Span::ruby`), and pieces set across
# one em in vertical text (`Span::upright`). Without them, rich text carries no code for them.
ruby = []
# Touch, pen and touchpad-pinch gestures (Windows, X11 via XInput 2, Wayland). Without it, a
# finger is the system's mouse.
touch = []
# Colour emoji in all text, from the system's emoji font, and in PDF files. Without it, emoji are
# plain letters (`Ui::set_emoji` and `Ui::emoji_in_full` still give colour).
emoji = []
# Windows: letters a font lacks drawn in the font Windows would pick. Without it, Windows' linked
# fonts are used in windows; `SystemText` on a surface and SVG text show missing-glyph boxes.
# (Linux always uses Fontconfig's choice.) Also: on Linux a fallback font with a taller line
# sized to the face's; on Windows, Linux, macOS and iOS what a fallback glyph still overhangs
# clipped to the line.
fallback-fonts = []
# CFF and CFF2 fonts (most `.otf` files). Without it, `FontFile::read` rejects them.
cff = []
# Small text of TrueType fonts that carry hinting instructions hinted by them, as FreeType's
# default interpreter does (vertically). Without it, every font is hinted as FreeType's
# autohinter does.
hinting = []
# Colour profiles and PNG gamma/chromaticities converted to the screen's colours. Without it,
# pictures are shown as if sRGB.
color-profiles = []
# JPEG's rarest processes, which only the ISO reference codec writes: hierarchical (a small
# image, then frames that add to it) and lossless arithmetic coded. Without them,
# `jpeg::decode` gives `None` for such files.
rare-jpeg = []
# WOFF2 fonts, with a Brotli decoder. Without it, `FontFile::read` rejects them.
woff2 = []
# The built-in words (menus, file dialog, calendar, bars) in German, Spanish, French, Japanese,
# Portuguese and Simplified Chinese, taken from the user's language. Without it, English until
# the app sets its own.
translations = []
# Windows shown by the GPU (Direct3D, Vulkan or OpenGL on Windows; OpenGL or Vulkan under X11;
# Vulkan dmabufs under Wayland; Metal on macOS and iOS; Vulkan or OpenGL ES on Android), loaded
# at run time; the CPU still draws every pixel. Without it, the CPU shows them too (`Renderer`).
gpu = []
# Windows drawn by the GPU too, where it is faster: boxes, borders, shadows, text, pictures,
# gradients, shapes and strokes (Direct3D 11 and 12, Vulkan, OpenGL, OpenGL ES and Metal). Within
# a few levels of 255 of the CPU at edges. Without it, the CPU draws every pixel.
gpu-draw = ["gpu"]
# Video and sound files played by the system's player (Media Foundation, GStreamer,
# AVFoundation, the NDK's media codecs, a browser's `<video>`), loaded at run time: `Video`,
# `ui.video`. Without it, none of that code.
video = []
# Colours and pictures brighter than SDR white (`El::brightness`, `Ui::add_hdr_picture`, PQ and
# HLG PNGs, Ultra HDR JPEGs), shown so on HDR screens: scRGB on Windows (Direct3D, Vulkan,
# OpenGL), PQ under Wayland, EDR on macOS. Without it, they show at SDR white.
hdr = ["gpu"]

# None.
[dependencies]

# The macOS windows, on a Mac: AppKit opens windows only on the main thread, where libtest
# runs no test.
[[test]]
name = "macos"
harness = false

# iOS in the simulator, from a Mac: UIKit runs only on the main thread too.
[[test]]
name = "ios"
harness = false

# Screen readers on an Android emulator, from Linux: the same file is the app checking itself.
[[test]]
name = "android"
harness = false

# The GPU on an Android emulator, driven from here: the library's checks there, the gallery.
[[test]]
name = "android_gpu"
harness = false

# Videos on a Mac and in the iOS simulator: AVFoundation plays only while the main thread's run
# loop turns.
[[test]]
name = "video_apple"
harness = false
required-features = ["video"]

# Videos on the web: this file is also the page's program, built for wasm32-unknown-unknown.
[[test]]
name = "video_web"
harness = false
required-features = ["video"]

# The system's parts on the web: this file is also the page's program, built for
# wasm32-unknown-unknown.
[[test]]
name = "web_system"
harness = false

# Videos on an Android emulator: the library's video tests, run there through adb.
[[test]]
name = "video_android"
required-features = ["video"]

# A video player.
[[example]]
name = "player"
required-features = ["video"]

# The library in a DLL with a C interface.
[[example]]
name = "overlay"
crate-type = ["cdylib"]

# docs.rs: every feature, the supported targets, items marked with the system and feature they
# need.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "aarch64-apple-ios", "aarch64-linux-android", "wasm32-unknown-unknown"]
rustdoc-args = ["--cfg", "docsrs"]
